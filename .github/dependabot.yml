version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - composer
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "illuminate/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "orchestra/testbench"
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        update-types:
          - minor
          - patch
    ignore:
      # v6 breaks checkout in Docker container jobs (service containers) due to a
      # broken includeIf.gitdir credential path — see actions/checkout#2359, #2386, #2393.
      # Remove this ignore once the upstream bug is fixed.
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
